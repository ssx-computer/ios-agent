# iOSAgent 构建流：macOS + Theos → 单个 .deb（含 Tweak + iosagentd）
# theos/sdks 走 actions/checkout（认证通道，规避 runner 出口网络对匿名
# git clone / curl 的阻断）。SDK 用 iPhoneOS14.5.sdk（对 RootHide/Dopamine
# 均向前兼容；私有 API 全部动态查找，不受 deployment 限制）。
name: build

on:
  push:
    branches: [main, master]
    paths:
      - "tweak/**"
      - ".github/**"
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          fetch-depth: 1

      - name: Checkout theos sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks
          fetch-depth: 1

      - name: Install theos
        run: |
          set -e
          brew install autoconf automake jq 2>/dev/null || true
          mv theos "$HOME/theos"
          cd "$HOME/theos"
          ./autogen.sh
          ./configure
          make
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build .deb
        run: |
          set -e
          cd tweak
          make clean package 2>&1 | tee build.log
          ls -la com.ssx.iosagent_*.deb
          test -f com.ssx.iosagent_*.deb || { tail -100 build.log; exit 1; }

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iosagent-deb
          path: |
            tweak/com.ssx.iosagent_*.deb
            tweak/build.log
